; Application PHP overrides — applies to both FPM and CLI/Horizon.
; Filename is prefixed "zz-" so it loads last and wins over stock conf.d fragments.

memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
session.upload_progress.enabled = 0
