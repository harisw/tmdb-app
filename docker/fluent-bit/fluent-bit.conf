[SERVICE]
    Flush           5
    # warn keeps Fluent Bit's own startup/error noise out of the app log group
    Log_Level       warn
    Daemon          off
    Parsers_File    parsers.conf

[INPUT]
    Name            tail
    Path            /var/www/storage/logs/*.log
    Tag             tmdb.storage
    # adds the source filename as a field so CloudWatch Insights queries can
    # filter by e.g. "user.log" vs "laravel.log" even though they share a tag
    Path_Key        file
    # Laravel/Monolog stack traces span many lines starting with whitespace or
    # "#N "; without this each line becomes its own CloudWatch log event
    Multiline.Parser laravel_multiline
    Skip_Long_Lines On
    Refresh_Interval 30
    # caps in-memory buffering so a burst of writes can't blow up RSS on a
    # resource-constrained host
    Mem_Buf_Limit   5MB

[OUTPUT]
    Name            cloudwatch_logs
    Match           tmdb.storage
    region          ${AWS_DEFAULT_REGION}
    log_group_name  /tmdb/storage-logs
    # one stream per host + source file, mirrors the {instance_id} pattern
    # already used for the app/horizon awslogs streams
    log_stream_prefix ${HOSTNAME}-
    log_stream_template $file
    auto_create_group true
    log_retention_days 14
