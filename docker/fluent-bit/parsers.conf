# Laravel/Monolog lines start with "[2026-07-02 10:15:03] local.ERROR: ...".
# Any line that does NOT start with that timestamp bracket (stack trace frames,
# wrapped exception messages, etc.) is treated as a continuation of the
# previous event instead of a new one.
[MULTILINE_PARSER]
    name          laravel_multiline
    type          regex
    flush_timeout 1000
    rule          "start_state"   "/^\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\].*/"  "cont"
    rule          "cont"          "/^(?!\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\]).*/"  "cont"
