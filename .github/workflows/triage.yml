name: Triage

on:
    schedule:
        - cron: '30 1 * * *'
    workflow_dispatch:
        inputs:
            fixture:
                description: Error event relative to tools/triage-agent. Leave empty to scan CloudWatch
                required: false
                default: ''
            hours:
                description: Hours of logs to scan
                type: number
                default: 26
            live:
                description: Create real issues and draft PRs
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: triage
    cancel-in-progress: false

jobs:
    triage:
        if: github.event_name != 'schedule' || vars.TRIAGE_SCHEDULE == 'on'
        runs-on: ubuntu-latest
        timeout-minutes: 55
        permissions:
            contents: read
            id-token: write
        env:
            FIXTURE: ${{ inputs.fixture }}
            HOURS: ${{ inputs.hours || 26 }}
            LIVE: ${{ github.event_name == 'schedule' || inputs.live }}
        defaults:
            run:
                working-directory: tools/triage-agent
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install
              run: uv sync --locked --no-dev

            - name: Get CloudWatch read access
              if: env.FIXTURE == ''
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  role-to-assume: ${{ vars.TRIAGE_AWS_ROLE_ARN }}
                  role-session-name: triage-${{ github.run_id }}
                  role-duration-seconds: 900
                  aws-region: ap-northeast-2

            - name: Create GitHub App token
              id: app
              if: env.LIVE == 'true'
              uses: actions/create-github-app-token@v3.3.0
              with:
                  client-id: ${{ vars.TRIAGE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - name: Run triage
              env:
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  GITHUB_TOKEN: ${{ steps.app.outputs.token }}
                  TRIAGE_GITHUB_APP_TOKEN: 'true'
                  GITHUB_REPO: ${{ github.repository }}
                  TRIAGE_BOT_LOGIN: ${{ env.LIVE == 'true' && format('{0}[bot]', steps.app.outputs.app-slug) || 'triage-agent[bot]' }}
                  TRIAGE_BASE_REF: ${{ github.ref_name }}
                  TRIAGE_REPO_PATH: ${{ github.workspace }}
              run: |
                  live=()
                  if [ "$LIVE" = "true" ]; then live=(--live); fi
                  if [ -n "$FIXTURE" ]; then
                      [[ "$FIXTURE" =~ ^fixtures/[A-Za-z0-9_-]+\.json$ ]]
                      uv run --locked --no-dev triage-agent run --fixture "$FIXTURE" "${live[@]}"
                  else
                      uv run --locked --no-dev triage-agent scan --hours "$HOURS" "${live[@]}"
                  fi

            - name: Upload run log
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: triage-run-${{ github.run_id }}
                  path: tools/triage-agent/runs.jsonl
                  if-no-files-found: ignore
                  retention-days: 30
