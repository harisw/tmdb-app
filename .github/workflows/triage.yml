name: Triage

on:
    workflow_dispatch:
        inputs:
            fixture:
                description: Error event, relative to tools/triage-agent
                required: true
                default: fixtures/process-watch-providers.json
            live:
                description: Create real issues and draft PRs
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            fingerprint: ${{ steps.read.outputs.fingerprint }}
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  persist-credentials: false

            - name: Read fingerprint
              id: read
              working-directory: tools/triage-agent
              env:
                  FIXTURE: ${{ inputs.fixture }}
              run: |
                  [[ "$FIXTURE" =~ ^fixtures/[A-Za-z0-9_-]+\.json$ ]]
                  fingerprint=$(jq -er .fingerprint "$FIXTURE")
                  [[ "$fingerprint" =~ ^[A-Za-z0-9_-]{1,64}$ ]]
                  echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    triage:
        runs-on: ubuntu-latest
        needs: resolve
        timeout-minutes: 55
        concurrency:
            group: triage-${{ needs.resolve.outputs.fingerprint }}
            cancel-in-progress: false
        defaults:
            run:
                working-directory: tools/triage-agent
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install
              run: uv sync --locked --no-dev

            - name: Create GitHub App token
              id: app
              if: inputs.live
              uses: actions/create-github-app-token@v3.3.0
              with:
                  client-id: ${{ vars.TRIAGE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - name: Run triage
              env:
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  GITHUB_TOKEN: ${{ steps.app.outputs.token }}
                  GITHUB_REPO: ${{ github.repository }}
                  TRIAGE_BOT_LOGIN: ${{ inputs.live && format('{0}[bot]', steps.app.outputs.app-slug) || 'triage-agent[bot]' }}
                  TRIAGE_BASE_REF: ${{ github.ref_name }}
                  TRIAGE_REPO_PATH: ${{ github.workspace }}
                  FIXTURE: ${{ inputs.fixture }}
                  LIVE: ${{ inputs.live }}
              run: |
                  args=(--fixture "$FIXTURE")
                  if [ "$LIVE" = "true" ]; then args+=(--live); fi
                  uv run --locked --no-dev triage-agent run "${args[@]}"

            - name: Upload run log
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: triage-run-${{ needs.resolve.outputs.fingerprint }}-${{ github.run_id }}
                  path: tools/triage-agent/runs.jsonl
                  if-no-files-found: ignore
                  retention-days: 30
