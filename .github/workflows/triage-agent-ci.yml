name: Triage agent CI

on:
    push:
        branches: [master]
        paths:
            - 'tools/triage-agent/**'
            - '.github/workflows/triage-agent-ci.yml'
    pull_request:
        paths:
            - 'tools/triage-agent/**'
            - '.github/workflows/triage-agent-ci.yml'

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: tools/triage-agent
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install
              run: uv sync --locked

            - name: Lint
              run: uv run ruff check src tests

            - name: Types
              run: uv run mypy src --ignore-missing-imports

            - name: Tests
              run: uv run pytest -q
