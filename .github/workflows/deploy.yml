name: CI/CD

on:
    push:
        branches: [master, development]
        paths-ignore:
            - 'docs/**'
            - 'infra/**'
            - 'tools/**'
            - '**.md'
    pull_request:
        branches: [master, development]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_DB: tmdb_test
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_pgsql, mbstring, zip, pcntl
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install dependencies
              run: composer install --optimize-autoloader --no-interaction

            - name: Copy env
              run: cp .env.example .env

            - name: Generate app key
              run: php artisan key:generate

            - name: Static analysis
              run: composer analyse -- --no-progress --error-format=github

            - name: Run tests
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: tmdb_test
                  DB_USERNAME: user
                  DB_PASSWORD: password
              run: php artisan test

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build frontend
              run: npm run build

    semgrep:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

            - name: Semgrep scan
              run: >-
                  uvx semgrep@1.183.0 scan
                  --metrics=off
                  --config p/php
                  --config p/javascript
                  --config p/secrets
                  --config p/github-actions
                  --config p/dockerfile
                  --exclude vendor
                  --exclude node_modules
                  --sarif-output=semgrep.sarif
                  --json-output=semgrep.json

            - name: Upload results to code scanning
              if: always()
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  sarif_file: semgrep.sarif
                  category: semgrep

            - name: Fail on error-severity findings
              run: |
                  jq -r '.results[]
                      | select(.extra.severity == "ERROR")
                      | select(.check_id != "dockerfile.security.missing-user.missing-user")
                      | "::error file=\(.path),line=\(.start.line)::\(.check_id)"' semgrep.json | tee errors.txt
                  test ! -s errors.txt

    zap:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_DB: tmdb_zap
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            APP_ENV: ci
            APP_DEBUG: false
            APP_URL: http://127.0.0.1:8000
            MAIL_MAILER: log
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: tmdb_zap
            DB_USERNAME: user
            DB_PASSWORD: password

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_pgsql, mbstring, zip, pcntl
                  ini-values: expose_php=Off
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install PHP dependencies
              run: composer install --no-dev --optimize-autoloader --no-interaction

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26'
                  cache: 'npm'

            - name: Build frontend
              run: |
                  npm ci
                  npm run build

            - name: Prepare app
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  php artisan migrate --force --no-interaction
                  php artisan db:seed --force --class=LanguageSeeder
                  php artisan db:seed --force --class=GenreSeeder
                  php artisan db:seed --force --class=CountrySeeder
                  php artisan db:seed --force --class=TmdbProviderSeeder

            - name: Start app
              env:
                  PHP_CLI_SERVER_WORKERS: 4
              run: |
                  php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
                  curl --retry 20 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:8000/up > /dev/null

            - name: ZAP baseline scan
              uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
              with:
                  target: http://127.0.0.1:8000
                  rules_file_name: .zap/rules.tsv
                  cmd_options: -j -I
                  allow_issue_writing: false
                  fail_action: true

            - name: Show app log
              if: failure()
              run: |
                  cat serve.log || true
                  tail -n 200 storage/logs/laravel.log || true

    deploy:
        runs-on: ubuntu-latest
        needs: [test, frontend, semgrep, zap]
        if: github.ref == 'refs/heads/master'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build and push app image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: true
                  provenance: false
                  tags: |
                      ${{ steps.login-ecr.outputs.registry }}/tmdb-app:latest
                      ${{ steps.login-ecr.outputs.registry }}/tmdb-app:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy to EC2
              env:
                  INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
              run: |
                  command_id=$(aws ssm send-command \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters 'commands=["/opt/tmdb/deploy.sh"]' \
                    --timeout-seconds 60 \
                    --query Command.CommandId --output text)

                  for _ in $(seq 120); do
                      sleep 5
                      status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
                      case "$status" in Pending | InProgress | Delayed) ;; *) break ;; esac
                  done

                  echo "SSM status: $status"
                  aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                    --query '[StandardOutputContent, StandardErrorContent]' --output text
                  test "$status" = Success
