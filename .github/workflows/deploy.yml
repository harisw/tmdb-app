name: Deploy to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Build and push app image
        env:
          ECR_URI: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_URI/tmdb-app:latest .
          docker push $ECR_URI/tmdb-app:latest

      - name: Build and push nginx image
        env:
          ECR_URI: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg APP_IMAGE=$ECR_URI/tmdb-app:latest \
            -f docker/nginx/Dockerfile \
            -t $ECR_URI/tmdb-nginx:latest \
            .
          docker push $ECR_URI/tmdb-nginx:latest

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/tmdb/deploy.sh"]'
