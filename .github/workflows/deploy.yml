name: CI/CD

on:
    push:
        branches: [master, development]
        paths-ignore:
            - 'docs/**'
            - 'infra/**'
            - 'tools/**'
            - '**.md'
    pull_request:
        branches: [master, development]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_DB: tmdb_test
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4.2.2

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_pgsql, mbstring, zip, pcntl
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install dependencies
              run: composer install --optimize-autoloader --no-interaction

            - name: Copy env
              run: cp .env.example .env

            - name: Generate app key
              run: php artisan key:generate

            - name: Static analysis
              run: composer analyse -- --no-progress --error-format=github

            - name: Run tests
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: tmdb_test
                  DB_USERNAME: user
                  DB_PASSWORD: password
              run: php artisan test

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4.2.2

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '26'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build frontend
              run: npm run build

    deploy:
        runs-on: ubuntu-latest
        needs: [test, frontend]
        if: github.ref == 'refs/heads/master'
        steps:
            - uses: actions/checkout@v4.2.2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4.0.3
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2.1.7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.4.1

            - name: Build and push app image
              uses: docker/build-push-action@v7.4.0
              with:
                  context: .
                  push: true
                  provenance: false
                  tags: |
                      ${{ steps.login-ecr.outputs.registry }}/tmdb-app:latest
                      ${{ steps.login-ecr.outputs.registry }}/tmdb-app:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy to EC2
              run: |
                  aws ssm send-command \
                    --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
                    --document-name "AWS-RunShellScript" \
                    --parameters 'commands=["/opt/tmdb/deploy.sh"]'
