name: Dependency Review

on:
    pull_request:
        branches: [master, development]

permissions:
    contents: read

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  persist-credentials: false

            - uses: actions/dependency-review-action@v5.0.0
              with:
                  fail-on-severity: high
                  fail-on-scopes: runtime, development, unknown

    composer-abandoned:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  persist-credentials: false

            - name: Fail on abandoned Composer packages
              run: |
                  abandoned=$(jq -r '(.packages + .["packages-dev"])[].name' composer.lock \
                      | xargs -P 8 -I{} sh -c 'curl -fsS --retry 3 "https://repo.packagist.org/p2/{}.json" | jq -r --arg p "{}" ".packages[\$p][0].abandoned // false | if . == false then empty elif . == true then \$p else \"\(\$p) (use \(.))\" end"')
                  if [ -n "$abandoned" ]; then
                      echo "::error::Abandoned Composer packages: $(echo "$abandoned" | paste -sd, -)"
                      exit 1
                  fi
