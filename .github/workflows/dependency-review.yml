name: Dependency Review

on:
    pull_request:
        branches: [master, development]

permissions:
    contents: read

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  persist-credentials: false

            - uses: actions/dependency-review-action@v5.0.0
              with:
                  fail-on-severity: high
                  fail-on-scopes: runtime, development, unknown

    composer-abandoned:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  persist-credentials: false

            - name: Fail on abandoned Composer packages
              shell: bash
              run: |
                  export FILTER='.packages[$p] // error("\($p) not found on Packagist") | .[0].abandoned // false | if . == false then empty elif . == true then $p else "\($p) (use \(.))" end'
                  names=$(jq -r '(.packages + .["packages-dev"])[].name' composer.lock)
                  test -n "$names"
                  abandoned=$(xargs -P 8 -I{} bash -c 'set -eo pipefail; curl -fsS --retry 3 --max-time 20 "https://repo.packagist.org/p2/$1.json" | jq -r --arg p "$1" "$FILTER"' _ {} <<< "$names")
                  if [ -n "$abandoned" ]; then
                      echo "::error::Abandoned Composer packages: $(echo "$abandoned" | paste -sd, -)"
                      exit 1
                  fi
