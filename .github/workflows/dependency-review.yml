name: Dependency Review

on:
    pull_request:
        branches: [master, development]

permissions:
    contents: read

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  persist-credentials: false

            - uses: actions/dependency-review-action@v5.0.0
              with:
                  fail-on-severity: high
                  fail-on-scopes: runtime, development, unknown

    composer-abandoned:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  persist-credentials: false

            - name: Fail on abandoned Composer packages
              shell: bash
              run: |
                  export FILTER='input | (.packages[$p] // []) | if length == 0 then error("\($p) has no metadata on Packagist") else .[0].abandoned // false end | if . == false then empty elif . == true then $p else "\($p) (use \(.))" end'
                  locked=$(jq -r '(.packages + .["packages-dev"])[] | "\(.name) \(.version)"' composer.lock)
                  test -n "$locked"
                  abandoned=$(xargs -P 8 -n 2 bash -c 'set -eo pipefail; case "$2" in dev-* | *-dev) file="$1~dev" ;; *) file="$1" ;; esac; curl -fsS --retry 3 --max-time 20 "https://repo.packagist.org/p2/$file.json" | jq -nr --arg p "$1" "$FILTER"' _ <<< "$locked")
                  if [ -n "$abandoned" ]; then
                      echo "::error::Abandoned Composer packages: $(echo "$abandoned" | paste -sd, -)"
                      exit 1
                  fi
