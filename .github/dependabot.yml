version: 2

updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          composer-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          npm-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: uv
      directory: /tools/triage-agent
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          uv-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          github-actions:
              update-types: [minor, patch]

    - package-ecosystem: docker
      directories:
          - /
          - /docker/nginx
      schedule:
          interval: weekly
      cooldown:
          default-days: 7

    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7

    - package-ecosystem: terraform
      directories:
          - /infra/database_dump
          - /infra/maintenance
          - /infra/scheduling
          - /infra/triage
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      groups:
          terraform:
              update-types: [minor, patch]
