version: 2

updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      groups:
          composer-security:
              applies-to: security-updates
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      groups:
          npm-security:
              applies-to: security-updates
              patterns: ['*']

    - package-ecosystem: uv
      directory: /tools/triage-agent
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      groups:
          uv-security:
              applies-to: security-updates
              patterns: ['*']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      groups:
          github-actions-security:
              applies-to: security-updates
              patterns: ['*']

    - package-ecosystem: docker
      directories:
          - /
          - /docker/nginx
      schedule:
          interval: weekly
      open-pull-requests-limit: 0

    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0

    - package-ecosystem: terraform
      directories:
          - /infra/database_dump
          - /infra/maintenance
          - /infra/scheduling
          - /infra/triage
      schedule:
          interval: monthly
      open-pull-requests-limit: 0
