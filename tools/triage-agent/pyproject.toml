[project]
name = "triage-agent"
version = "0.1.0"
description = "Turns production errors into GitHub issues and verified draft fixes."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "claude-agent-sdk>=0.2.179",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "pydantic>=2.9",
]

[project.scripts]
triage-agent = "triage_agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
