version: '3.8'

services:
    postgres:
        image: pgvector/pgvector:pg17
        container_name: postgres_db
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: tmdb
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
        networks:
            - laravel-network
    redis:
        image: redis:7.4-alpine
        container_name: redis
        restart: always
        ports:
            - "6379:6379"
        command: redis-server --requirepass password --appendonly yes
        volumes:
            - redis_data:/data
        networks:
            - laravel-network

networks:
    laravel-network:
        driver: bridge
        name: laravel-network

volumes:
    postgres_data:
        driver: local
    redis_data:
