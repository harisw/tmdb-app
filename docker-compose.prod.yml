name: tmdb

services:
  app:
    image: ${ECR_URI}/tmdb-app:latest
    env_file:
      - /opt/tmdb/.env
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /opt/tmdb/public:/var/www/public
    restart: unless-stopped
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge
