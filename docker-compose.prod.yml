name: tmdb

services:
    app:
        image: ${ECR_URI}/tmdb-app:latest
        env_file:
            - /opt/tmdb/.env
        ports:
            - '127.0.0.1:9000:9000'
        volumes:
            - /opt/tmdb/public:/var/www/public
        restart: unless-stopped
        networks:
            - laravel-network
        logging:
            driver: awslogs
            options:
                awslogs-group: /tmdb/app
                awslogs-region: ${AWS_DEFAULT_REGION:-ap-northeast-2}
                awslogs-stream: app
                awslogs-create-group: 'true'
                mode: non-blocking
                max-buffer-size: 4m
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis-data:/data
        networks:
            - laravel-network
        command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru

    horizon:
        image: ${ECR_URI}/tmdb-app:latest
        env_file:
            - /opt/tmdb/.env
        command: php artisan horizon
        restart: unless-stopped
        depends_on:
            - redis
        networks:
            - laravel-network
        logging:
            driver: awslogs
            options:
                awslogs-group: /tmdb/horizon
                awslogs-region: ${AWS_DEFAULT_REGION:-ap-northeast-2}
                awslogs-stream: horizon
                awslogs-create-group: 'true'
                mode: non-blocking
                max-buffer-size: 4m

volumes:
    redis-data:

networks:
    laravel-network:
        driver: bridge
